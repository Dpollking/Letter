<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c0d0f">
<title>Для тебя ♡</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap">
<link rel="preload" as="image" href="assets/paper.webp">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="prefetch" as="image" href="assets/otter_r.webp">
<link rel="prefetch" as="image" href="assets/otter_l.webp">
<link rel="prefetch" as="image" href="assets/otter_b.webp">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1c0d0f;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#f7e9e6;position:fixed;inset:0}
:root{--pink:#e0849f;--pink-hi:#f3a3bb;--pink-lo:#b9476f;--serif:"Cormorant Garamond","Playfair Display","Didot","Bodoni 72",Georgia,"Times New Roman",serif}
.app{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;overflow:clip;background:radial-gradient(120% 80% at 20% 10%,#4a2220 0%,#2a1214 45%,#170a0c 100%)}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(45% 30% at 15% 12%,rgba(224,132,159,.24),transparent 70%),radial-gradient(40% 28% at 90% 60%,rgba(224,132,159,.18),transparent 70%),radial-gradient(45% 28% at 10% 92%,rgba(185,71,111,.22),transparent 70%)}

/* ---------- звёздное небо ---------- */
.app{background:#070a1c}
.sky{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(90% 55% at 50% 118%,rgba(120,52,92,.55) 0%,transparent 60%),radial-gradient(70% 50% at 12% 0%,rgba(46,58,128,.55) 0%,transparent 65%),radial-gradient(60% 45% at 95% 30%,rgba(70,40,110,.4) 0%,transparent 70%),linear-gradient(180deg,#05071a 0%,#0b1030 52%,#1a1030 100%)}
.sky::before{content:"";position:absolute;left:-30%;top:-10%;width:160%;height:60%;background:linear-gradient(112deg,transparent 30%,rgba(190,175,255,.10) 46%,rgba(255,225,190,.10) 54%,transparent 70%);filter:blur(22px);transform:rotate(-8deg)}
.st{position:absolute;border-radius:50%;background:#fff;box-shadow:0 0 4px 1px rgba(255,240,215,.7);animation:tw var(--d,3s) ease-in-out var(--dl,0s) infinite}
@keyframes tw{0%,100%{opacity:var(--o,.9);transform:scale(1)}50%{opacity:.12;transform:scale(.55)}}
.sp{position:absolute;width:var(--s,16px);height:var(--s,16px);color:#fff4d8;filter:drop-shadow(0 0 5px rgba(255,236,190,.95)) drop-shadow(0 0 12px rgba(255,214,150,.6));animation:glint var(--d,3.6s) ease-in-out var(--dl,0s) infinite;opacity:0}
.sp svg{width:100%;height:100%;fill:currentColor;display:block}
@keyframes glint{0%,100%{opacity:0;transform:scale(.2) rotate(0)}30%{opacity:1;transform:scale(1) rotate(25deg)}50%{opacity:.85;transform:scale(.8) rotate(45deg)}70%{opacity:1;transform:scale(1.1) rotate(70deg)}}
.shoot{position:absolute;width:140px;height:2px;border-radius:2px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,248,230,.95));opacity:0;animation:shoot 9s linear var(--dl,0s) infinite}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(151deg)}2%{opacity:1}9%{opacity:0;transform:translate(-340px,190px) rotate(151deg)}100%{opacity:0;transform:translate(-340px,190px) rotate(151deg)}}

/* сердечки */
.hearts{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.h{position:absolute;color:#f3a3bb;animation:drift var(--d,4s) ease-in-out var(--dl,0s) infinite,twinkle var(--t,2.4s) ease-in-out var(--dl,0s) infinite;filter:drop-shadow(0 0 6px rgba(243,163,187,.55))}
.h svg{width:100%;height:100%;fill:currentColor;display:block}
@keyframes drift{0%{transform:translate(0,0) rotate(-8deg) scale(.9)}25%{transform:translate(var(--dx),calc(var(--dy)*.5)) rotate(6deg) scale(1.1)}50%{transform:translate(calc(var(--dx)*-.6),var(--dy)) rotate(-4deg) scale(.95)}75%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.4)) rotate(8deg) scale(1.12)}100%{transform:translate(0,0) rotate(-8deg) scale(.9)}}
@keyframes twinkle{0%,100%{opacity:var(--o,.7)}35%{opacity:calc(var(--o,.7)*.3)}60%{opacity:var(--o,.7)}80%{opacity:calc(var(--o,.7)*.55)}}

/* ---------- конверт ---------- */
:root{--didone:"Playfair Display","Bodoni 72","Bodoni MT",Didot,"Times New Roman",serif;--elegant:"Cormorant Garamond","Playfair Display",Georgia,serif;--script:"Great Vibes","Marck Script","Snell Roundhand","Apple Chancery",cursive;--paper:url(assets/paper.webp)}
.stage{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,4dvh,34px);padding:env(safe-area-inset-top) 20px env(safe-area-inset-bottom);transition:opacity .8s ease,transform .9s cubic-bezier(.5,0,.3,1),visibility 0s .9s}
.stage.gone{opacity:0;transform:translateY(8dvh) scale(.82);visibility:hidden;pointer-events:none}
.eyebrow{font:400 13px/1 var(--elegant);letter-spacing:.5em;padding-left:.5em;color:#ead7ae;text-align:center;text-transform:uppercase;text-shadow:0 0 12px rgba(233,211,168,.45)}
.env{--w:min(80vw,360px,60dvh);position:relative;width:var(--w);height:calc(var(--w)*.68);margin-top:calc(var(--w)*.36);cursor:pointer;perspective:1300px;-webkit-tap-highlight-color:transparent;outline:none;animation:envfloat 5s ease-in-out infinite}
@keyframes envfloat{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-6px) rotate(.5deg)}}
.env.open{animation:none}
.env>*{position:absolute}
.env::before{content:"";position:absolute;left:4%;right:4%;bottom:-9%;height:14%;border-radius:50%;background:radial-gradient(ellipse,rgba(0,0,0,.65),transparent 70%);filter:blur(7px)}
.tex{background-image:var(--paper),var(--bg);background-blend-mode:overlay,normal;background-size:240px 240px,auto}
.env-back{inset:0;border-radius:3px;--bg:linear-gradient(180deg,#2a1210 0%,#3a1a15 100%);box-shadow:0 26px 50px rgba(0,0,0,.6),0 0 0 1px rgba(255,210,170,.05)}
.flw{left:0;right:0;top:0;height:58%;z-index:4;transform-origin:50% 0;transition:transform .85s cubic-bezier(.45,0,.2,1),z-index 0s .42s,filter .85s;filter:drop-shadow(0 5px 6px rgba(0,0,0,.55))}
.flap{position:absolute;inset:0;clip-path:polygon(0 0,100% 0,50% 100%);--bg:linear-gradient(180deg,#6a3328 0%,#4d241c 100%)}
.flap::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,215,180,.12),transparent 45%)}
.env.open .flw{transform:rotateX(180deg);z-index:1;filter:drop-shadow(0 -4px 6px rgba(0,0,0,.5)) brightness(.72)}
.letter{left:6.5%;right:6.5%;top:5%;bottom:8%;border-radius:2px;--bg:linear-gradient(172deg,#f7eed6 0%,#efe2c3 100%);box-shadow:0 1px 1px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.4),inset 0 0 0 1px rgba(150,110,60,.10),inset 0 -20px 30px rgba(170,130,70,.10);color:#6a2f22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--w)*.022);font-size:calc(var(--w)*.062);transition:transform 1.25s cubic-bezier(.3,1.08,.4,1) .6s;z-index:2;text-align:center;background-size:170px 170px,auto}
.env.open .letter{transform:translateY(-60%)}
.lt{font:400 1em/1 var(--didone);letter-spacing:.2em;padding-left:.2em;text-transform:uppercase;white-space:nowrap}
.lt i{display:inline-block;font:400 2.1em/.7 var(--script);letter-spacing:0;text-transform:none;margin:0 0 0 .05em;position:relative;top:.12em;color:#7a3224}
.lm{font:400 3.6em/.9 var(--script);color:#7a3224;margin-top:.04em;text-shadow:0 1px 0 rgba(255,246,225,.7)}
.lh{font:400 1.1em/1 var(--didone);color:#8c2c3c;margin-top:.18em}
.ld{display:flex;flex-direction:column;align-items:center;font:400 2.6em/.92 var(--didone);letter-spacing:.01em;font-variant-numeric:lining-nums}
.ld b{font:400 .2em/1 var(--didone);color:#8c2c3c;margin:.5em 0 .45em}
.efw{inset:0;z-index:3;pointer-events:none}
.fp{position:absolute;inset:0}
.fl{clip-path:polygon(0 0,50.4% 55%,0 100%);--bg:linear-gradient(120deg,#69322a,#4a231c)}
.fr{clip-path:polygon(100% 0,49.6% 55%,100% 100%);--bg:linear-gradient(240deg,#4d251e,#33170f)}
.fbw{position:absolute;inset:0;filter:drop-shadow(0 -1px 0 rgba(255,215,180,.18)) drop-shadow(0 -4px 5px rgba(0,0,0,.5))}
.fb{clip-path:polygon(-1% 100%,50% 54%,101% 100%);--bg:linear-gradient(180deg,#623027 0%,#4a231c 55%,#3e1d17 100%);border-radius:0 0 3px 3px}
.fb::after,.fl::after,.fr::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,230,200,.11) 50%,transparent 70%);transform:translateX(-130%);animation:sheen 5s ease-in-out infinite}
@keyframes sheen{0%,50%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.seal{left:50%;top:58%;width:18%;aspect-ratio:1;margin:-9% 0 0 -9%;z-index:7;border-radius:51% 49% 53% 47%/48% 52% 48% 52%;background-image:var(--paper),radial-gradient(circle at 36% 30%,#f3e2bd 0%,#dcbf8c 34%,#c39d64 70%,#9d7544 100%);background-blend-mode:overlay,normal;background-size:90px 90px,auto;box-shadow:0 6px 10px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.5),inset 0 -4px 6px rgba(120,80,35,.45),inset 0 3px 4px rgba(255,248,225,.65);display:grid;place-items:center;transition:left .9s cubic-bezier(.5,0,.3,1) .1s,top .9s cubic-bezier(.5,0,.3,1) .1s,transform .9s cubic-bezier(.5,0,.3,1) .1s}
.seal::before{content:"";position:absolute;inset:13%;border-radius:50%;background:radial-gradient(circle at 60% 70%,rgba(255,244,214,.35),transparent 60%),radial-gradient(circle at 40% 30%,#cda86f,#b78e55);box-shadow:inset 0 2px 3px rgba(105,70,30,.55),inset 0 -1px 2px rgba(255,246,220,.55),0 1px 0 rgba(255,246,220,.35)}
.seal span{position:relative;font:italic 400 calc(var(--w)*.062)/1 var(--didone);color:#a37a45;text-shadow:0 1px 0 rgba(255,246,222,.75),0 -1px 1px rgba(90,55,20,.55);letter-spacing:-.04em}
.env.open .seal{left:2%;top:93%;transform:rotate(-14deg) scale(.95)}
.env-note{left:0;right:0;top:73%;z-index:6;text-align:center;pointer-events:none;font:400 calc(var(--w)*.1)/1 var(--script);color:#efdcb2;text-shadow:0 1px 0 rgba(255,236,200,.35),0 -1px 1px rgba(30,10,5,.8),0 0 14px rgba(240,210,150,.35);transition:opacity .35s}
.env.open .env-note{opacity:0}
.tap{font:italic 400 19px/1 var(--elegant);color:#f2e3c4;letter-spacing:.06em;animation:tapp 1.8s ease-in-out infinite;transition:opacity .3s;text-shadow:0 0 12px rgba(240,223,192,.5)}
.stage.opened .tap{opacity:0}
@keyframes tapp{0%,100%{opacity:.65;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* искры при открытии */
.spark{position:fixed;z-index:9;pointer-events:none;left:0;top:0;color:#f6b4c8;font-size:var(--s,16px);line-height:1;opacity:0;animation:burst var(--bd,1.3s) cubic-bezier(.2,.7,.3,1) forwards;text-shadow:0 0 8px rgba(255,200,215,.9)}
.spark.w{color:#fff0c8;text-shadow:0 0 10px rgba(255,226,160,.95)}
@keyframes burst{0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(.3)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x1),var(--y1)) scale(1.2) rotate(var(--r))}}

/* ---------- сцена с картой ---------- */
.scene{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6dvh,14px);padding:calc(env(safe-area-inset-top) + clamp(54px,8dvh,72px)) clamp(14px,4.5vw,28px) calc(env(safe-area-inset-bottom) + clamp(12px,2.4dvh,22px));opacity:0;visibility:hidden;transform:scale(.2) translateY(14dvh);transform-origin:50% 45%;transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.9,.25,1),visibility 0s 1.1s}
.scene.show{opacity:1;visibility:visible;transform:none;transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.9,.25,1),visibility 0s}
.scene h1{font:400 clamp(26px,7.6vw,42px)/1.08 var(--didone);letter-spacing:.02em;text-align:center;color:#fbf0dc;text-shadow:0 0 18px rgba(233,200,150,.35)}
.scene h1 em{font:400 1.25em/.8 var(--script);color:#f0cf98;letter-spacing:0}
.mapbox{position:relative;flex:1 1 auto;min-height:200px;width:min(100%,640px);border-radius:22px;overflow:hidden;border:1px solid rgba(233,205,160,.55);box-shadow:0 14px 40px rgba(0,0,0,.55),0 0 34px rgba(233,200,150,.25);background:#2a1519}
.mapbox iframe{position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;filter:saturate(.95) contrast(1.02)}
/* экран ожидания, пока страница не загрузится */
.waiting .music{opacity:0;pointer-events:none}
.waiting .stage{opacity:0!important;visibility:hidden;pointer-events:none}
.wait{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;text-align:center;pointer-events:none;transition:opacity .9s ease,visibility .9s}
body:not(.waiting) .wait{opacity:0;visibility:hidden}
.wait .wt{font:400 clamp(40px,12.5vw,76px)/1.05 var(--script);color:#f1deb4;text-shadow:0 0 22px rgba(240,200,140,.45),0 2px 0 rgba(30,10,5,.6);animation:wtglow 2.4s ease-in-out infinite}
.wait .ws{font:italic 400 clamp(16px,4.6vw,22px)/1.3 var(--elegant);color:#d9c6c9;letter-spacing:.06em;opacity:.85}
.wait .wh{display:flex;gap:12px}
.wait .wh i{width:14px;height:14px;background:#e98aa7;transform:rotate(-45deg);position:relative;opacity:.25;animation:wtb 1.4s ease-in-out infinite}
.wait .wh i::before,.wait .wh i::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:#e98aa7}
.wait .wh i::before{left:7px;top:0}.wait .wh i::after{left:0;top:-7px}
.wait .wh i:nth-child(2){animation-delay:.25s}.wait .wh i:nth-child(3){animation-delay:.5s}
@keyframes wtb{0%,100%{opacity:.25;transform:rotate(-45deg) scale(.8)}50%{opacity:1;transform:rotate(-45deg) scale(1.15)}}
@keyframes wtglow{0%,100%{opacity:.8}50%{opacity:1}}
/* интерактивная карта (Leaflet + тёмная подложка) */
#lmap{position:absolute;inset:0;z-index:0;background:#14121f;touch-action:none}
.mapbox.fb #lmap{display:none}.mapbox:not(.fb) iframe,.mapbox:not(.fb)>.ring,.mapbox:not(.fb)>.pin{display:none}
.mapbox.fb iframe{pointer-events:auto}
#lmap .leaflet-tile-pane{filter:invert(1) hue-rotate(205deg) brightness(.95) contrast(.92) saturate(.75)}
.lpin{background:none!important;border:0!important;pointer-events:none}
.lp{position:absolute;left:0;top:0;width:0;height:0}
.lp .hop{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%);animation:pinhop2 2s ease-in-out infinite;white-space:normal;width:max-content}
@keyframes pinhop2{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,calc(-100% - 8px))}}
.lp .hop svg{width:44px;height:44px;margin-top:6px;fill:#ff5b8a;stroke:#fff;stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 4px 8px rgba(60,10,30,.6)) drop-shadow(0 0 10px rgba(255,120,160,.8))}
.lp .dot{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:rgba(255,91,138,.6)}
.lp .dot::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,91,138,.85);animation:ripple 2s ease-out infinite}
#lmap .leaflet-bar{border:0;box-shadow:0 6px 16px rgba(0,0,0,.45);border-radius:14px;overflow:hidden}
#lmap .leaflet-bar a{width:40px;height:40px;line-height:40px;font-size:22px;color:#f3d9a8;background:rgba(40,22,44,.88);border-bottom:1px solid rgba(233,205,160,.25);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#lmap .leaflet-bar a:last-child{border-bottom:0}
#lmap .leaflet-bar a:hover,#lmap .leaflet-bar a:active{background:rgba(80,40,70,.95);color:#fff}
#lmap .leaflet-control-attribution{background:rgba(20,14,30,.65);color:#bfa9b8;font-size:10px;padding:1px 6px;border-radius:8px 0 0 0}
#lmap .leaflet-control-attribution a{color:#e6c9a0}
.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;z-index:3;pointer-events:none;animation:pinhop 2s ease-in-out infinite}
@keyframes pinhop{0%,100%{transform:translate(-50%,-100%)}50%{transform:translate(-50%,calc(-100% - 8px))}}
.bubble{position:relative;max-width:min(78vw,300px);padding:10px 14px;border-radius:16px;text-align:center;font:600 clamp(13px,3.8vw,16px)/1.25 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Arial,sans-serif;color:#5a2a22;background:linear-gradient(180deg,#fbf2dc,#ead9b6);border:1px solid rgba(190,150,90,.6);box-shadow:0 8px 22px rgba(30,10,10,.5)}
.bubble::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border-top:8px solid #ead9b6;border-left:7px solid transparent;border-right:7px solid transparent}
.pin svg{width:44px;height:44px;margin-top:6px;fill:#ff5b8a;stroke:#fff;stroke-width:1.2;stroke-linejoin:round;filter:drop-shadow(0 4px 8px rgba(60,10,30,.6)) drop-shadow(0 0 10px rgba(255,120,160,.8))}
.ring{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:rgba(255,91,138,.55);z-index:2;pointer-events:none}
.ring::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,91,138,.8);animation:ripple 2s ease-out infinite}
@keyframes ripple{0%{transform:scale(1);opacity:1}100%{transform:scale(4.5);opacity:0}}
.coords{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,640px);min-height:48px;padding:0 16px;border-radius:14px;border:1px dashed rgba(233,205,160,.65);background:rgba(255,255,255,.05);color:#fff3ef;font:600 clamp(15px,4.4vw,18px)/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.01em;cursor:pointer;-webkit-tap-highlight-color:transparent;position:relative}
.coords svg{width:18px;height:18px;fill:none;stroke:#f0cf98;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.coords small{position:absolute;left:0;right:0;top:-10px;text-align:center;font:500 10px/1 -apple-system,Roboto,Arial,sans-serif;letter-spacing:.18em;color:#d8c39c;text-transform:uppercase}
.coords.ok{border-style:solid;border-color:#9fe3b5;color:#eafff0}
.btns{display:flex;gap:10px;width:min(100%,640px)}
.btn{flex:1 1 0;min-height:50px;border-radius:999px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;font:600 clamp(14px,4vw,16px)/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Arial,sans-serif;color:#fff;text-decoration:none;cursor:pointer;border:0;-webkit-tap-highlight-color:transparent}
.btn-a{color:#4a2018;background:linear-gradient(180deg,#f6e4bc,#c9a46c);box-shadow:0 0 0 3px rgba(233,205,160,.16),0 0 22px rgba(233,200,150,.4),0 8px 20px rgba(30,10,5,.5),inset 0 1px 0 rgba(255,255,255,.6)}
.btn-b{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn:active{filter:brightness(1.1);transform:scale(.98)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 90px);transform:translate(-50%,20px);z-index:40;padding:10px 16px;border-radius:999px;background:rgba(30,12,16,.9);border:1px solid rgba(159,227,181,.6);color:#eafff0;font:600 14px/1 -apple-system,Roboto,Arial,sans-serif;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-aspect-ratio:1/1) and (min-width:700px){.scene{padding-top:calc(env(safe-area-inset-top) + 28px)}}
@media (max-height:600px){.scene h1{font-size:24px}.mapbox{min-height:150px}.btn{min-height:44px}.coords{min-height:42px}}
/* кнопка музыки */
.music{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 10px);z-index:30;width:52px;height:52px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:#fbe3ea;-webkit-tap-highlight-color:transparent}
.music .mh{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 7px rgba(243,163,187,.7));transform-origin:50% 55%}
.music .mh path{fill:rgba(58,18,32,.55);stroke:#f3a3bb;stroke-width:1.3;stroke-linejoin:round}
.music .mn{position:relative;width:36%;height:36%;fill:currentColor;margin-top:-6%}
.music .x{position:absolute;width:34%;height:2px;background:#fbe3ea;border-radius:2px;transform:rotate(-45deg);margin-top:-6%;transition:opacity .25s}
.music.on .x{opacity:0}
.music:not(.on):not(.touched) .mh{animation:mglow 1.8s ease-in-out infinite}
.music.on .mh{animation:mbeat 1.5s ease-in-out infinite}
@keyframes mglow{0%,100%{filter:drop-shadow(0 0 5px rgba(243,163,187,.5));transform:scale(1)}50%{filter:drop-shadow(0 0 16px rgba(243,163,187,.95));transform:scale(1.1)}}
@keyframes mbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(1)}42%{transform:scale(1.08)}56%{transform:scale(1)}}
/* выдры: быстро выглядывают с правого и левого края при открытии карты */
:root{--ow2:clamp(130px,42vw,230px)}
.ot{position:fixed;top:50%;width:var(--ow2);z-index:8;pointer-events:none;filter:drop-shadow(0 0 14px rgba(0,0,0,.5));transition:transform var(--td,.3s) cubic-bezier(.2,1.25,.4,1)}
.ot img{display:block;width:100%;height:auto}
.ot.r img,.ot.l img{-webkit-mask-image:linear-gradient(#000 80%,transparent);mask-image:linear-gradient(#000 80%,transparent)}
.ot.r{right:calc(var(--ow2)*-.03);transform:translate(120%,-50%)}
.ot.l{left:calc(var(--ow2)*-.03);transform:translate(-120%,-50%);--td:.25s}
.ot.on{transform:translate(0,-50%)}
.ot.sing.on img{animation:sg .34s ease-in-out infinite alternate;transform-origin:50% 100%;will-change:transform}
.ot.r.sing.on img{transform-origin:100% 50%}.ot.l.sing.on img{transform-origin:0 50%}
@keyframes sg{0%{transform:translate(0,0) rotate(-1.4deg) scale(1)}50%{transform:translate(1px,-3px) rotate(.4deg) scale(1.012)}100%{transform:translate(-1px,1px) rotate(1.6deg) scale(.995)}}
.ot.sing.on{pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ot.mad.r{right:calc(var(--ow2)*-.09)}.ot.mad.l{left:calc(var(--ow2)*-.09)}
.ot.mad{--td:.28s;filter:drop-shadow(0 0 16px rgba(160,20,20,.55))}
.shh{position:fixed;left:50%;top:30%;z-index:9;transform:translate(-50%,-50%) scale(.5);opacity:0;pointer-events:none;padding:14px 24px;border-radius:20px;background:linear-gradient(180deg,#ffe6e0,#f2b3aa);color:#701818;border:1px solid rgba(160,60,50,.65);box-shadow:0 10px 28px rgba(30,5,5,.55);font:800 clamp(24px,8vw,38px)/1.1 -apple-system,BlinkMacSystemFont,"SF Pro Text",Roboto,Arial,sans-serif;text-align:center;white-space:nowrap;transition:opacity .25s,transform .35s cubic-bezier(.2,1.4,.4,1)}
.shh.on{opacity:1;transform:translate(-50%,-50%) scale(1);animation:shk .45s ease-in-out .35s 3}
@keyframes shk{0%,100%{margin-left:0}25%{margin-left:-6px}75%{margin-left:6px}}

.ot.b{top:auto;bottom:0;left:50%;width:clamp(190px,60vw,320px);transform:translate(-50%,108%);--td:.35s}
.ot.b.on{transform:translate(-50%,0)}
@media (min-width:900px){:root{--ow2:clamp(190px,17vw,300px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body class="waiting">
<div class="wait" id="wait" role="status" aria-live="polite"><div class="wt">Ожидайте доставки почты</div><div class="wh" aria-hidden="true"><i></i><i></i><i></i></div><div class="ws">письмо уже в пути…</div></div>
<main class="app" id="app">
  <div class="sky" id="sky" aria-hidden="true"><i class="shoot" style="right:8%;top:6%;--dl:2s"></i><i class="shoot" style="right:30%;top:16%;--dl:6.5s"></i></div>
  <div class="hearts" id="hearts" aria-hidden="true"></div>

  <section class="stage" id="stage">
    <div class="eyebrow">Для тебя</div>
    <div class="env" id="env" role="button" tabindex="0" aria-label="Открыть конверт">
      <div class="env-back tex"></div>
      <div class="flw"><div class="flap tex"></div></div>
      <div class="letter tex"><div class="lt">Прочти</div><div class="lm">меня</div><div class="lh">&#9829;</div></div>
      <div class="efw"><div class="fp fl tex"></div><div class="fp fr tex"></div><div class="fbw"><div class="fp fb tex"></div></div></div>
      <div class="env-note">Открой меня</div>
      <div class="seal"><span>О&#9829;</span></div>
    </div>
    <div class="tap">Нажми на конверт</div>
  </section>

  <section class="scene" id="scene" aria-live="polite">
    <h1>Наше место <em>встречи</em></h1>
    <div class="mapbox" id="mapbox">
      <div id="lmap"></div>
      <iframe id="map" title="Карта Минска, место встречи" referrerpolicy="no-referrer-when-downgrade" data-src="https://yandex.ru/map-widget/v1/?ll=27.549079%2C53.901814&amp;z=16&amp;l=map&amp;lang=ru_RU"></iframe>
      <div class="ring"></div>
      <div class="pin"><div class="bubble">Жду тебя тут в пятницу 20.11 в 17:00</div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></div>
    </div>
    <button class="coords" id="coords" type="button" aria-label="Скопировать координаты"><small>Нажми, чтобы скопировать</small><span id="ctext">53.901814, 27.549079</span><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg></button>
    <div class="btns">
      <a class="btn btn-a" id="ymaps" href="https://yandex.ru/maps/?pt=27.549079,53.901814&amp;z=17&amp;l=map" target="_blank" rel="noopener">Яндекс Карты</a>
      <a class="btn btn-b" id="navi" href="https://yandex.ru/maps/?rtext=~53.901814,27.549079&amp;rtt=auto" target="_blank" rel="noopener">Яндекс Навигатор</a>
    </div>
  </section>
</main>

<button class="music" id="music" type="button" aria-label="Включить музыку" aria-pressed="false"><svg class="mh" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg><svg class="mn" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v11.3A3.5 3.5 0 1 0 11 17.5V8h6V3H9z"/></svg><span class="x"></span></button>
<div class="ot r sing" id="otR" aria-hidden="true"><img src="assets/otter_r.webp" alt="" width="520" height="853" decoding="async"></div>
<div class="ot l sing" id="otL" aria-hidden="true"><img src="assets/otter_l.webp" alt="" width="520" height="853" decoding="async"></div>
<div class="ot b sing" id="otB" aria-hidden="true"><img src="assets/otter_b.webp" alt="" width="560" height="732" decoding="async"></div>
<div class="ot l mad" id="mL" aria-hidden="true"><img src="assets/mad_l.webp" alt="" width="520" height="849" decoding="async"></div>
<div class="ot r mad" id="mR" aria-hidden="true"><img src="assets/mad_r.webp" alt="" width="520" height="849" decoding="async"></div>
<div class="shh" id="shh" aria-live="polite">Не мешай петь!</div>
<div class="toast" id="toast" role="status">Координаты скопированы ✓</div>

<script>window.MUSIC_NOAUTO=1</script>
<script src="assets/music.js?v=4"></script>
<script>
(function(){
  var i,s,HP='M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z',LAT='53.901814',LON='27.549079',COORDS=LAT+', '+LON;
  var sky=document.getElementById('sky'),R=Math.random,t='';
  for(i=0;i<150;i++){var z=(R()<.12?2.6:R()<.4?1.8:1.1).toFixed(1);
    t+='<i class="st" style="left:'+(R()*100).toFixed(1)+'%;top:'+(R()*100).toFixed(1)+'%;width:'+z+'px;height:'+z+'px;--o:'+(.45+R()*.55).toFixed(2)+';--d:'+(2+R()*4.5).toFixed(1)+'s;--dl:-'+(R()*6).toFixed(1)+'s"></i>';}
  var SP='<svg viewBox="0 0 24 24"><path d="M12 0l2.2 9.8L24 12l-9.8 2.2L12 24l-2.2-9.8L0 12l9.8-2.2z"/></svg>';
  for(i=0;i<20;i++){t+='<span class="sp" style="left:'+(R()*96).toFixed(1)+'%;top:'+(R()*92).toFixed(1)+'%;--s:'+(9+R()*16).toFixed(0)+'px;--d:'+(2.6+R()*3.4).toFixed(1)+'s;--dl:-'+(R()*5).toFixed(1)+'s">'+SP+'</span>';}
  sky.insertAdjacentHTML('afterbegin',t);

  var hearts=document.getElementById('hearts');s='';
  for(i=0;i<10;i++){
    var sz=(2+R()*3.4).toFixed(1),o=(.3+R()*.4).toFixed(2);
    s+='<span class="h" style="left:'+(R()*94).toFixed(1)+'%;top:'+(R()*92).toFixed(1)+'%;width:'+sz+'vmin;height:'+sz+'vmin;--o:'+o+';opacity:'+o+';--d:'+(3+R()*2.6).toFixed(1)+'s;--t:'+(1.8+R()*2).toFixed(1)+'s;--dl:-'+(R()*4).toFixed(1)+'s;--dx:'+Math.round((R()-.5)*44)+'px;--dy:'+Math.round(-14-R()*26)+'px"><svg viewBox="0 0 24 24"><path d="'+HP+'"/></svg></span>';
  }
  hearts.innerHTML=s;

  var env=document.getElementById('env'),stage=document.getElementById('stage'),scene=document.getElementById('scene'),opened=false;
  function burst(){
    var r=env.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.2,n=34,k,e,a,d,sp;
    for(k=0;k<n;k++){
      e=document.createElement('span');sp=k%3===0;
      e.className='spark'+(sp?' w':'');e.textContent=sp?'✦':'♥';
      a=Math.random()*Math.PI*2;d=70+Math.random()*Math.min(190,innerWidth*.5);
      e.style.cssText='--s:'+(10+Math.random()*18).toFixed(0)+'px;--bd:'+(1+Math.random()*.9).toFixed(2)+'s;--x0:'+cx+'px;--y0:'+cy+'px;--x1:'+(cx+Math.cos(a)*d)+'px;--y1:'+(cy+Math.sin(a)*d-40)+'px;--r:'+Math.round((Math.random()-.5)*120)+'deg';
      document.body.appendChild(e);
      (function(x){setTimeout(function(){x.remove()},2200)})(e);
    }
  }
  function openEnv(){
    if(window.olyaMusic)olyaMusic.start();
    if(opened) return;opened=true;
    env.classList.add('open');stage.classList.add('opened');
    setTimeout(burst,350);setTimeout(burst,900);
    setTimeout(burst,1500);setTimeout(function(){stage.classList.add('gone');scene.classList.add('show')},3200);
    window.__startOtters(4500);
    setTimeout(function(){if(window.__lm)window.__lm.invalidateSize()},3400);
    setTimeout(function(){if(window.__lm)window.__lm.invalidateSize()},4200);
  }
  env.addEventListener('click',openEnv);
  env.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openEnv()}});


  /* ждём полной загрузки (шрифты, картинки, песня) и только потом показываем конверт */
  (function(){
    var done=false,t0=Date.now();
    function img(u){return new Promise(function(r){var i=new Image();i.onload=i.onerror=function(){r()};i.src=u})}
    function ready(){
      if(done) return;done=true;
      var wait=Math.max(0,1800-(Date.now()-t0));
      setTimeout(function(){document.body.classList.remove('waiting')},wait);
    }
    var ps=[
      new Promise(function(r){if(document.readyState==='complete')r();else window.addEventListener('load',function(){r()})}),
      (document.fonts&&document.fonts.ready)||Promise.resolve(),
      img('assets/paper.webp'),img('assets/otter_r.webp'),img('assets/otter_l.webp'),img('assets/otter_b.webp'),img('assets/mad_l.webp'),img('assets/mad_r.webp'),
      window.__songReady||Promise.resolve()
    ];
    Promise.all(ps).then(ready,ready);
    setTimeout(ready,15000);
  })();

  /* выдры: поют по кругу; тап по поющей — музыка стоп, злые выдры; повторный тап по музыке — снова поют */
  (function(){
    var oL=document.getElementById('otL'),oR=document.getElementById('otR'),oB=document.getElementById('otB'),
        mL=document.getElementById('mL'),mR=document.getElementById('mR'),shh=document.getElementById('shh'),
        all=[oL,oR,oB,mL,mR],TT=[],angry=false,btn=document.getElementById('music');
    function tm(f,ms){TT.push(setTimeout(f,ms))}
    function clr(){TT.forEach(clearTimeout);TT=[]}
    function off(){all.forEach(function(e){e.classList.remove('on')});shh.classList.remove('on')}
    function sing(delay){
      clr();
      tm(function(){oL.classList.add('on')},delay);
      tm(function(){oL.classList.remove('on')},delay+5300);
      tm(function(){oR.classList.add('on')},delay+6000);
      tm(function(){oR.classList.remove('on')},delay+11300);
      tm(function(){oB.classList.add('on')},delay+12000);
      tm(function(){oB.classList.remove('on')},delay+17300);
      tm(function(){sing(0)},delay+18500);
    }
    function mad(){
      if(angry) return;angry=true;clr();off();
      if(window.olyaMusic)olyaMusic.stop();
      tm(function(){mL.classList.add('on')},350);
      tm(function(){shh.classList.add('on')},800);
      tm(function(){mL.classList.remove('on')},2800);
      tm(function(){mR.classList.add('on')},3300);
      tm(function(){mR.classList.remove('on')},5800);
      tm(function(){shh.classList.remove('on')},6000);
    }
    [oL,oR,oB].forEach(function(e){e.addEventListener('click',mad)});
    btn.addEventListener('click',function(){
      setTimeout(function(){if(angry){angry=false;clr();off();sing(400)}},0);
    });
    /* первая выдра появляется, когда в песне 0:34 (если звук не идёт — через 9 сек после нажатия) */
    window.__startOtters=function(){
      if(angry) return;
      var t0=Date.now(),poll=setInterval(function(){
        var t=window.olyaMusic&&olyaMusic.time?olyaMusic.time():-1;
        if(angry){clearInterval(poll);return}
        if((t>=34)||(Date.now()-t0>9000)){clearInterval(poll);if(!angry)sing(0)}
      },150);
    };
  })();

  /* карта: Leaflet (жесты, + / −), при сбое загрузки — виджет Яндекса */
  (function(){
    var box=document.getElementById('mapbox');
    function fail(){box.classList.add('fb');var f=document.getElementById('map');if(f&&!f.src)f.src=f.getAttribute('data-src')}
    var sc=document.createElement('script');sc.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    sc.onerror=fail;
    sc.onload=function(){
      try{
        var m=L.map('lmap',{center:[+LAT,+LON],zoom:16,minZoom:10,maxZoom:19,zoomControl:true,attributionControl:true,tap:true,bounceAtZoomLimits:false});
        m.attributionControl.setPrefix(false);
        var tl=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
        var errs=0;tl.on('tileerror',function(){if(++errs>8&&!tl._ok) fail()});tl.on('tileload',function(){tl._ok=1});
        var html='<div class="lp"><div class="dot"></div><div class="hop"><div class="bubble">Жду тебя тут в пятницу 20.11 в 17:00</div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></div></div>';
        L.marker([+LAT,+LON],{icon:L.divIcon({className:'lpin',html:html,iconSize:[0,0],iconAnchor:[0,0]}),interactive:false,keyboard:false}).addTo(m);
        box.classList.remove('fb');window.__lm=m;
        setTimeout(function(){m.invalidateSize()},300);
      }catch(e){fail()}
    };
    document.head.appendChild(sc);
  })();

  var cb=document.getElementById('coords'),toast=document.getElementById('toast'),tt=0;
  function done(){
    cb.classList.add('ok');toast.classList.add('on');clearTimeout(tt);
    tt=setTimeout(function(){cb.classList.remove('ok');toast.classList.remove('on')},1800);
  }
  function fallback(){
    var t=document.createElement('textarea');t.value=COORDS;t.setAttribute('readonly','');t.style.cssText='position:fixed;left:-999px;top:0;opacity:0';
    document.body.appendChild(t);t.select();t.setSelectionRange(0,99);
    try{document.execCommand('copy')}catch(e){}
    t.remove();done();
  }
  cb.addEventListener('click',function(){
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(COORDS).then(done,fallback)}else fallback();
  });

  /* Навигатор: пробуем открыть приложение, иначе веб-маршрут */
  var navi=document.getElementById('navi');
  navi.addEventListener('click',function(e){
    if(!/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) return;
    e.preventDefault();
    var fb=setTimeout(function(){window.open(navi.href,'_blank')},1600);
    function hid(){if(document.hidden){clearTimeout(fb);document.removeEventListener('visibilitychange',hid)}}
    document.addEventListener('visibilitychange',hid);
    window.location.href='yandexnavi://build_route_on_map?lat_to='+LAT+'&lon_to='+LON;
  });
})();
</script>
