<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c0d0f">
<title>Особенное приглашение</title>
<meta name="robots" content="noindex">
<link rel="preload" as="image" href="assets/olya.webp">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#1c0d0f;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:#f7e9e6;position:fixed;inset:0;
}
:root{
  --pink:#e0849f;--pink-hi:#f3a3bb;--pink-lo:#b9476f;
  --serif:"Cormorant Garamond","Playfair Display","Didot","Bodoni 72",Georgia,"Times New Roman",serif;
  --u:min(1vw,.58vh);
}

/* ---------- сцена ---------- */
.app{
  position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;overflow:hidden;overflow:clip;
  background:radial-gradient(120% 80% at 20% 10%,#4a2220 0%,#2a1214 45%,#170a0c 100%);
}
.glow{position:absolute;inset:0;pointer-events:none;
  background:
   radial-gradient(40% 25% at 12% 14%,rgba(224,132,159,.22),transparent 70%),
   radial-gradient(35% 22% at 92% 58%,rgba(224,132,159,.18),transparent 70%),
   radial-gradient(40% 25% at 10% 88%,rgba(185,71,111,.22),transparent 70%);}

.girl{position:absolute;left:50%;right:auto;top:0;height:76%;width:auto;aspect-ratio:3/4;z-index:1;
  transform:translateX(-50%);
  filter:saturate(1.05) contrast(1.02);
  -webkit-mask-image:linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%),linear-gradient(to bottom,#000 70%,transparent 100%);
  -webkit-mask-composite:source-in;
          mask-image:linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%),linear-gradient(to bottom,#000 70%,transparent 100%);
          mask-composite:intersect;
  opacity:0;animation:fadeIn 1.2s .1s ease forwards}
.shade{position:absolute;inset:0;z-index:2;pointer-events:none;
  background:
   linear-gradient(to right,rgba(23,10,12,.55) 0%,rgba(23,10,12,0) 45%),
   linear-gradient(to top,rgba(23,10,12,.97) 0%,rgba(23,10,12,.92) 48%,rgba(23,10,12,.8) 60%,rgba(23,10,12,.4) 69%,rgba(23,10,12,0) 77%);}

/* ---------- сердечки ---------- */
.hearts{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.h{position:absolute;color:var(--pink);opacity:.5;animation:float 4s ease-in-out infinite}
.h svg{display:block;width:100%;height:100%;fill:currentColor}
.h.o svg{fill:none;stroke:currentColor;stroke-width:1.6}
.h1{left:6%;top:9%;width:15vmin;height:15vmin;opacity:.9;filter:drop-shadow(0 0 8px rgba(243,163,187,.8))}
.h2{right:2%;top:41%;width:11vmin;height:11vmin;filter:blur(3px);opacity:.45;animation-delay:-2s}
.h3{left:-2%;top:70%;width:12vmin;height:12vmin;filter:blur(4px);opacity:.4;animation-delay:-4s}
.h4{right:8%;top:80%;width:9vmin;height:9vmin;filter:blur(2px);opacity:.4;animation-delay:-1s}
.h5{left:44%;top:3%;width:5vmin;height:5vmin;opacity:.5;animation-delay:-3s}
.hd{display:none}
.hx,.hd{animation:drift var(--d,4s) ease-in-out var(--dl,0s) infinite;filter:drop-shadow(0 0 6px rgba(243,163,187,.55))}
@keyframes drift{0%{transform:translate(0,0) rotate(-8deg) scale(.9)}25%{transform:translate(var(--dx),calc(var(--dy)*.5)) rotate(6deg) scale(1.1)}50%{transform:translate(calc(var(--dx)*-.6),var(--dy)) rotate(-4deg) scale(.95)}75%{transform:translate(calc(var(--dx)*.5),calc(var(--dy)*.4)) rotate(8deg) scale(1.12)}100%{transform:translate(0,0) rotate(-8deg) scale(.9)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-22px) rotate(6deg) scale(1.08)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ---------- контент ---------- */
.content{
  position:absolute;left:0;right:0;bottom:0;z-index:5;
  padding:0 clamp(18px,6vw,34px) calc(env(safe-area-inset-bottom) + clamp(34px,8dvh,84px));
  display:flex;flex-direction:column;
  max-height:calc(100dvh - env(safe-area-inset-top));
}
.rise{opacity:0;animation:rise .9s ease forwards}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:clamp(9px,2.7vw,12px);letter-spacing:.2em;color:#e9d5d0;
  margin-bottom:clamp(6px,1.6dvh,14px);animation-delay:.3s;white-space:nowrap}
.eyebrow::before{content:"";width:clamp(18px,7vw,40px);height:1px;background:rgba(233,213,208,.5)}
.eyebrow::after{content:"";flex:0 0 clamp(14px,5vw,30px);height:1px;background:rgba(233,213,208,.5)}
h1{text-shadow:0 2px 14px rgba(15,5,8,.7);font-family:var(--serif);font-style:italic;font-weight:500;line-height:1.02;letter-spacing:-.01em;
  font-size:clamp(32px,min(12.4vw,6.4dvh),68px);color:#fbefec;animation-delay:.45s;max-width:11em;
  text-shadow:0 2px 20px rgba(0,0,0,.5)}
h1 em{color:var(--pink-hi);font-style:italic}
.squiggle{display:block;width:clamp(120px,48vw,230px);height:auto;margin:clamp(2px,.6dvh,8px) 0 clamp(6px,1.6dvh,14px) clamp(0px,6vw,36px);animation-delay:.55s}
.lead{font-size:clamp(12px,min(3.8vw,1.9dvh),17px);line-height:1.42;color:#ecd9d4;max-width:21em;
  animation-delay:.65s;text-shadow:0 1px 10px rgba(0,0,0,.6)}

.card{position:relative;margin:clamp(8px,1.8dvh,22px) auto 0;width:100%;max-width:460px;
  padding:clamp(8px,1.6dvh,20px) clamp(34px,10vw,56px) clamp(10px,2dvh,22px);
  text-align:center;border-radius:clamp(20px,6vw,30px);
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));
  border:1px solid rgba(255,255,255,.22);
  box-shadow:0 10px 40px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.25);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);
  animation-delay:.8s}
.card .cal{display:block;margin:-4px auto 4px;width:clamp(20px,3.8dvh,36px);height:auto;color:#f2c9d3}
.card p{font-family:var(--serif);font-style:italic;font-weight:500;color:#f7e5e1;
  font-size:clamp(16px,min(5.4vw,2.8dvh),27px);line-height:1.2}
.card .sprig{position:absolute;top:50%;width:clamp(22px,7vw,34px);height:auto;color:#d98aa3;opacity:.85;transform:translateY(-50%)}
.card .sprig.l{left:clamp(8px,3.2vw,18px)}
.card .sprig.r{right:clamp(8px,3.2vw,18px);transform:translateY(-50%) scaleX(-1)}
.card .tail{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:clamp(2px,.8dvh,8px);color:#e79cb3}
.card .tail::before,.card .tail::after{content:"";width:clamp(22px,8vw,44px);height:1px;background:rgba(231,156,179,.6)}
.card .tail svg{width:clamp(14px,3.6vw,20px);height:auto}

.actions{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,22px);
  margin:clamp(10px,2.2dvh,28px) auto 0;width:100%;max-width:460px;animation-delay:.95s;position:relative}
.btn{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;white-space:nowrap;color:#fff;touch-action:manipulation}
.btn-yes{flex:1 1 auto;min-height:clamp(44px,6.8dvh,66px);padding:0 clamp(16px,5vw,30px);border-radius:999px;
  font-size:clamp(16px,min(5vw,2.9dvh),22px);font-weight:500;letter-spacing:.01em;
  background:linear-gradient(180deg,#f08dab 0%,#cf5f86 55%,#b9476f 100%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 0 0 3px rgba(240,141,171,.16),0 0 28px rgba(240,120,160,.55),0 8px 22px rgba(120,20,60,.45),inset 0 1px 0 rgba(255,255,255,.5);
  animation:pulse 2.8s ease-in-out infinite;transition:transform .15s}
.btn-yes:active{transform:scale(.97)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 3px rgba(240,141,171,.16),0 0 24px rgba(240,120,160,.45),0 8px 22px rgba(120,20,60,.45),inset 0 1px 0 rgba(255,255,255,.5)}
  50%{box-shadow:0 0 0 6px rgba(240,141,171,.12),0 0 40px rgba(240,120,160,.8),0 8px 22px rgba(120,20,60,.45),inset 0 1px 0 rgba(255,255,255,.5)}}
.btn-no{flex:0 0 auto;min-height:clamp(40px,6dvh,58px);padding:0 clamp(20px,6.5vw,34px);border-radius:999px;
  font-size:clamp(14px,min(4.4vw,2.5dvh),19px);
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.4);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 0 14px rgba(255,255,255,.08);
  transition:transform .35s cubic-bezier(.3,1.4,.5,1),background .2s}
.btn-no:active{background:rgba(255,255,255,.15)}

/* ---------- выезжающий кот (без фона, виден целиком) ---------- */
.scrim{position:fixed;left:0;right:0;bottom:0;height:72dvh;z-index:15;pointer-events:none;opacity:0;transition:opacity .5s ease;
  background:linear-gradient(to top,rgba(18,7,9,.96) 0%,rgba(18,7,9,.94) 60%,rgba(18,7,9,0) 100%)}
body.cat-on .scrim{opacity:1}
.cat-sheet{
  position:fixed;left:50%;bottom:0;z-index:20;
  width:min(100vw,560px,calc(58dvh*1.305));margin-left:calc(min(100vw,560px,calc(58dvh*1.305))/-2);
  transform:translateY(110%);visibility:hidden;pointer-events:none;
  transition:transform .6s cubic-bezier(.22,1,.36,1),visibility 0s .6s;
  padding-bottom:calc(env(safe-area-inset-bottom) + clamp(12px,2dvh,22px));
}
.cat-sheet.open{transform:translateY(0);visibility:visible;pointer-events:auto;transition:transform .6s cubic-bezier(.22,1,.36,1),visibility 0s 0s}
.cat-title{position:relative;z-index:3;text-align:center;margin-bottom:clamp(2px,1dvh,10px);
  font-family:var(--serif);font-style:italic;font-weight:700;color:#fff;
  font-size:clamp(34px,min(11vw,6.4dvh),60px);letter-spacing:.01em;
  text-shadow:0 2px 0 #000,0 0 18px rgba(0,0,0,.9),0 0 36px rgba(224,132,159,.7)}
.cat-stage{position:relative;width:100%}
.cat-img{display:block;width:100%;height:auto;position:relative;z-index:1;
  filter:drop-shadow(0 -6px 24px rgba(0,0,0,.55));-webkit-user-drag:none;user-select:none}
.cat-yes{position:relative;z-index:4;display:flex;margin:-5.4% auto 0;
  width:min(84%,380px);min-height:clamp(48px,7.4dvh,66px);padding:0 24px;border-radius:999px;
  font-size:clamp(17px,min(5.3vw,3dvh),23px);font-weight:600;
  background:linear-gradient(180deg,#f492b0 0%,#d4638a 55%,#bb4a72 100%);
  border:1px solid rgba(255,255,255,.6);
  box-shadow:0 0 0 4px rgba(240,141,171,.22),0 0 34px rgba(240,120,160,.75),0 10px 24px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.5);
  animation:pulse 2.2s ease-in-out infinite}
.cat-yes:active{transform:scale(.97)}
.cat-close{position:absolute;z-index:5;top:clamp(2px,.8dvh,8px);right:clamp(10px,3vw,16px);
  width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.45);
  background:rgba(0,0,0,.45);color:#fff;font-size:20px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent}
.cat-close:active{background:rgba(255,255,255,.2)}

/* ---------- широкие экраны: планшет / компьютер ---------- */
@media (min-aspect-ratio:1/1){
  .girl{right:2%;left:auto;top:0;height:100%;max-width:62%;transform:none;
    -webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%),linear-gradient(to bottom,#000 82%,transparent 100%);
    mask-image:linear-gradient(to right,transparent 0,#000 30%),linear-gradient(to bottom,#000 82%,transparent 100%)}
  .shade{background:linear-gradient(to right,rgba(23,10,12,.92) 0%,rgba(23,10,12,.7) 38%,rgba(23,10,12,0) 62%),linear-gradient(to top,rgba(23,10,12,.6),transparent 40%)}
  .content{top:0;right:auto;width:min(50%,620px);justify-content:center;padding:calc(env(safe-area-inset-top) + 3dvh) clamp(28px,5vw,80px) calc(env(safe-area-inset-bottom) + 3dvh)}
  h1{font-size:clamp(34px,min(5.2vw,9.2dvh),84px)}
  .lead{font-size:clamp(13px,min(1.5vw,2.4dvh),19px)}
  .card{margin-left:0;max-width:440px}
  .card p{font-size:clamp(17px,min(2.2vw,3.4dvh),28px)}
  .actions{margin-left:0;max-width:440px}
  .btn-yes{font-size:clamp(16px,min(1.6vw,2.9dvh),22px)}
  .btn-no{font-size:clamp(14px,min(1.4vw,2.5dvh),19px)}
  .eyebrow{font-size:clamp(10px,min(1vw,1.7dvh),13px)}
}
@media (min-aspect-ratio:1/1){.h1{left:auto;right:6%;top:9%}.hx{display:none}.hd{display:block;filter:drop-shadow(0 0 6px rgba(243,163,187,.55))}}
@media (min-aspect-ratio:1/1) and (max-height:520px){
  .lead{display:none}
}
/* очень низкие/узкие телефоны */
@media (max-height:700px) and (max-aspect-ratio:1/1){
  .girl{height:74%;top:-3%}
  .squiggle{display:none}
  h1{font-size:clamp(28px,min(10vw,5.2dvh),60px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .rise,.girl{opacity:1}
}
.h1{display:none!important}
.music{position:fixed;left:6%;top:9%;z-index:30;width:max(15vmin,56px);height:max(15vmin,56px);padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:#fbe3ea;-webkit-tap-highlight-color:transparent}
.music .mh{position:absolute;inset:0;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 7px rgba(243,163,187,.7));transform-origin:50% 55%}
.music .mh path{fill:rgba(58,18,32,.55);stroke:#f3a3bb;stroke-width:1.3;stroke-linejoin:round}
.music .mn{position:relative;width:36%;height:36%;fill:currentColor;margin-top:-6%}
.music .x{position:absolute;width:34%;height:2px;background:#fbe3ea;border-radius:2px;transform:rotate(-45deg);margin-top:-6%;transition:opacity .25s}
.music.on .x{opacity:0}
.music:not(.on):not(.touched) .mh{animation:mglow 1.8s ease-in-out infinite}
.music.on .mh{animation:mbeat 1.5s ease-in-out infinite}
@keyframes mglow{0%,100%{filter:drop-shadow(0 0 5px rgba(243,163,187,.5));transform:scale(1)}50%{filter:drop-shadow(0 0 16px rgba(243,163,187,.95));transform:scale(1.1)}}
@keyframes mbeat{0%,100%{transform:scale(1)}14%{transform:scale(1.13)}28%{transform:scale(1)}42%{transform:scale(1.08)}56%{transform:scale(1)}}
.music-hint{position:fixed;left:12px;top:calc(9% - 46px);z-index:30;height:36px;display:flex;align-items:center;padding:0 14px;border-radius:18px;font:600 14px/1 var(--sans,system-ui,sans-serif);color:#fff;background:linear-gradient(180deg,#e58aa8,#b45577);box-shadow:0 6px 18px rgba(0,0,0,.35),0 0 18px rgba(243,163,187,.45);pointer-events:none;transition:opacity .3s,visibility 0s .3s;animation:hintnudge 1.6s ease-in-out infinite}
.music-hint::after{content:"";position:absolute;left:34px;bottom:-6px;border-top:7px solid #b45577;border-left:6px solid transparent;border-right:6px solid transparent}
.music.touched~.music-hint,.music.on~.music-hint{opacity:0;visibility:hidden}
@keyframes hintnudge{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@media (min-aspect-ratio:1/1){.music{left:auto;right:2%;top:5%}}
@media (hover:hover) and (pointer:fine){.music-hint{display:none}}
@media (prefers-reduced-motion:reduce){.music .mh,.music-hint{animation:none!important}}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="glow"></div>
  <img class="girl" src="assets/olya.webp" alt="Оля" width="480" height="640" decoding="async" fetchpriority="high">
  <div class="shade"></div>

  <div class="hearts" aria-hidden="true">
    <span class="h h1 o"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></span>
    <span class="h h2"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></span>
    <span class="h h3"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></span>
    <span class="h h4"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></span>
    <span class="h h5"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></span>
    <span class="h hx" style="left:8%;top:30%;width:9vmin;height:9vmin;opacity:0.8;--d:4.2s;--dl:-0.5s;--dx:14px;--dy:-26px"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></span>
    <span class="h hx" style="left:14%;top:40%;width:5vmin;height:5vmin;opacity:0.75;--d:3.6s;--dl:-2.8s;--dx:12px;--dy:-28px"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></span>
    <span class="h hx" style="left:46%;top:41%;width:6vmin;height:6vmin;opacity:0.6;filter:blur(1px);--d:3.3s;--dl:-0.3s;--dx:10px;--dy:-32px"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.3 4.5c2.2 0 3.9 1.2 5.7 3.3 1.8-2.1 3.5-3.3 5.7-3.3 3.3 0 5.4 3.5 3.9 7.1C19.5 16.4 12 21 12 21z"/></svg></span>

  <div class="cat-title">Нажми да!</div>
  <button class="cat-close" id="close" type="button" aria-label="Закрыть" tabindex="-1">✕</button>
  <div class="cat-stage">
    <img class="cat-img" src="assets/cat.webp" alt="Кот смотрит матом" width="800" height="613" decoding="async" draggable="false">
    <a class="btn cat-yes" id="catYes" href="https://t.me/donvnick" rel="noopener" tabindex="-1">Да, с радостью ♡</a>
  </div>
</aside>

<script>
(function(){
  var cat=document.getElementById('cat'),no=document.getElementById('no'),
      close=document.getElementById('close'),yes2=document.getElementById('catYes');
  var dodges=0,isOpen=false;
  var canHover=window.matchMedia&&window.matchMedia('(hover:hover) and (pointer:fine)').matches;

  function open(){
    if(isOpen) return;            // повторное «Нет» не дублирует кота
    isOpen=true;
    cat.setAttribute('aria-hidden','false');
    close.tabIndex=0;yes2.tabIndex=0;
    void cat.offsetHeight;        // форсируем reflow для transition
    cat.classList.add('open');document.body.classList.add('cat-on');
  }
  function shut(){
    isOpen=false;
    cat.classList.remove('open');document.body.classList.remove('cat-on');
    cat.setAttribute('aria-hidden','true');
    close.tabIndex=-1;yes2.tabIndex=-1;
    no.style.transform='';dodges=0;
  }
  var LIMIT=4,last=0;
  function dodge(){
    if(dodges>=LIMIT||isOpen) return;
    var now=Date.now(); if(now-last<160) return; last=now;
    dodges++;
    var r=no.getBoundingClientRect(),vw=window.innerWidth,vh=window.innerHeight,m=16;
    var dx=(Math.random()<.5?-1:1)*(110+Math.random()*130),dy=(Math.random()-.5)*180;
    var cur=new DOMMatrixReadOnly(getComputedStyle(no).transform);
    if(r.left+dx<m||r.right+dx>vw-m) dx=-dx;
    if(r.top+dy<m||r.bottom+dy>vh-m) dy=-dy;
    no.style.transform='translate('+(cur.m41+dx)+'px,'+(cur.m42+dy)+'px) rotate('+(dx>0?8:-8)+'deg)';
  }
  no.addEventListener('click',function(e){
    // мышь: пока не убежала LIMIT раз — клик не засчитывается, кнопка убегает
    if(canHover&&e.detail>0&&dodges<LIMIT&&!isOpen){dodge();return}
    open();
  });
  close.addEventListener('click',shut);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&isOpen)shut()});

  // Компьютер: «Нет» убегает, как только курсор приближается (LIMIT раз), потом даётся нажать
  if(canHover){
    no.style.transition='transform .18s ease-out,background .2s';
    document.addEventListener('mousemove',function(e){
      if(dodges>=LIMIT||isOpen) return;
      var r=no.getBoundingClientRect(),pad=70;
      if(e.clientX>r.left-pad&&e.clientX<r.right+pad&&e.clientY>r.top-pad&&e.clientY<r.bottom+pad) dodge();
    });
    no.addEventListener('mouseenter',dodge);
  }
})();
</script>
